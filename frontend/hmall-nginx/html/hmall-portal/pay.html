<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>收银台 - 微商城</title>
  <link rel="icon" href="./favicon.ico">
  <link rel="stylesheet" type="text/css" href="./css/flow.css">
</head>
<body>
<div id="app">

  <div class="topbar">
    <div class="wrap">
      <div class="top-left"><span>欢迎来到微商城！</span><span class="dot">|</span><span class="auth-slot"></span></div>
      <div class="links">
        <a href="/">首页</a><span class="dot">|</span>
        <a href="/search.html">去购物</a><span class="dot">|</span>
        <a href="/cart.html">我的购物车</a><span class="dot">|</span>
        <a href="/myOrder.html">我的订单</a>
      </div>
    </div>
  </div>

  <header class="masthead">
    <div class="wrap">
      <a href="/" aria-label="微商城首页"><img class="brand-logo" src="./img/logo.png" alt="微商城"></a>
      <div class="page-title">收银台</div>
      <div class="mast-actions">
        <a class="btn-ghost" href="/myOrder.html">我的订单</a>
        <a class="btn-ghost" href="/search.html">去购物</a>
      </div>
    </div>
  </header>

  <main class="flow-main">
    <div class="wrap">

      <div class="steps">
        <div class="step done"><span class="no">✓</span>购物车<span class="bar"></span></div>
        <div class="step done"><span class="no">✓</span>确认订单<span class="bar"></span></div>
        <div class="step on"><span class="no">3</span>支付<span class="bar"></span></div>
        <div class="step"><span class="no">4</span>完成</div>
      </div>

      <div class="pay-banner">
        <div class="ok">
          <span class="circle">✓</span>
          <div>
            订单提交成功，请及时付款
            <div class="sub">订单号 {{order.id}} · <span v-if="remainTime">剩余支付时间 {{remainTime}}</span><span v-else>请在 30 分钟内完成支付</span></div>
          </div>
        </div>
        <div class="amount">应付金额<b>￥{{util.formatPrice(order.totalFee)}}</b></div>
      </div>

      <div class="card">
        <div class="card-head">
          <strong>余额支付</strong>
          <span class="hint">微商城演示环境仅开放余额支付</span>
        </div>
        <div class="card-body">
          <div class="pay-form">
            <span class="pay-method">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round">
                <rect x="2" y="5" width="20" height="14" rx="3"/><path d="M2 10h20M6 15h4"/>
              </svg>
              扣减余额
            </span>
            <label for="payPassword">支付密码</label>
            <input id="payPassword" type="password" v-model="password" placeholder="演示环境可任意输入" @keyup.enter="payByBalance">
            <button class="btn btn-primary" type="button" :disabled="paying" @click="payByBalance">
              {{paying ? "支付中…" : "确认支付"}}
            </button>
          </div>
          <div class="pay-note" v-if="tip">{{tip}}</div>
          <div class="pay-note" v-else>支付成功后将自动跳转到结果页；可在「我的订单」查看订单状态。</div>
        </div>
      </div>

    </div>
  </main>

  <footer>
    <div class="wrap">
      <div class="f-brand">
        <strong>微商城</strong><small>WEI MALL</small><p>好物优选 · 轻松购</p>
      </div>
    </div>
    <div class="f-bottom">© 2026 微商城 WEI MALL · 演示项目</div>
  </footer>
</div>

<script src="./js/vue.js"></script>
<script src="./js/axios.min.js"></script>
<script src="./js/common.js"></script>
<script>
  new Vue({
    el: "#app",
    data: {
      util,
      order: {id: "—", totalFee: 0},
      password: "",
      payOrderNo: "",
      remainTime: "",
      paying: false,
      tip: "",
      timer: null
    },
    created() {
      util.store.set("return-url", location.href);
      if (!util.store.get("user-info")) { location.href = "/login.html"; return; }
      const id = util.getUrlParam("id");
      if (!id) { this.tip = "缺少订单号，请从「我的订单」进入。"; return; }
      util.rememberOrder(id);
      axios.get("/orders/" + id).then(resp => {
        this.order = resp;
        this.startTimer();
        this.createPayOrder();
      }).catch(() => {
        this.tip = "订单查询失败，请返回「我的订单」重新进入。";
      });
    },
    beforeDestroy() { if (this.timer) clearInterval(this.timer); },
    methods: {
      startTimer() {
        const t = new Date(this.order.createTime).getTime();
        if (!t || isNaN(t)) return;
        const deadLine = t + 30 * 60 * 1000;
        const tick = () => {
          const left = deadLine - Date.now();
          if (left <= 0) {
            this.remainTime = "已超时";
            clearInterval(this.timer);
            return;
          }
          this.remainTime = Math.floor(left / 60000) + "分" + Math.floor((left % 60000) / 1000) + "秒";
        };
        tick();
        this.timer = setInterval(tick, 1000);
      },
      createPayOrder() {
        axios.post("/pay-orders", {
          bizOrderNo: this.order.id,
          amount: this.order.totalFee,
          payType: 5,
          orderInfo: "微商城商品",
          payChannelCode: "balance"
        }, {transformResponse: data => data})
          .then(resp => { this.payOrderNo = resp; })
          .catch(() => { this.tip = "支付单创建失败：该订单可能已完成支付，请前往「我的订单」查看状态。"; });
      },
      payByBalance() {
        if (!this.payOrderNo) { this.tip = "支付单尚未就绪，请稍后再试。"; return; }
        this.paying = true;
        this.tip = "";
        axios.post("/pay-orders/" + this.payOrderNo, {id: this.payOrderNo, pw: this.password},
          {transformResponse: data => data})
          .then(() => {
            util.rememberOrder(this.order.id);
            location.href = "/paysuccess.html?orderId=" + this.order.id;
          })
          .catch(() => {
            this.paying = false;
            this.tip = "支付失败，请检查余额或稍后重试。";
          });
      }
    }
  });
</script>
<script src="./js/auth.js"></script>
</body>
</html>
