<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>我的订单 - 微商城</title>
  <link rel="icon" href="./favicon.ico">
  <link rel="stylesheet" type="text/css" href="./css/flow.css">
</head>
<body>
<div id="app">

  <div class="topbar">
    <div class="wrap">
      <div class="top-left"><span>欢迎来到微商城！</span><span class="dot">|</span><span class="auth-slot"></span></div>
      <div class="links">
        <a href="/">首页</a><span class="dot">|</span>
        <a href="/search.html">去购物</a><span class="dot">|</span>
        <a href="/cart.html">我的购物车</a><span class="dot">|</span>
        <a href="/myOrder.html">我的订单</a>
      </div>
    </div>
  </div>

  <header class="masthead">
    <div class="wrap">
      <a href="/" aria-label="微商城首页"><img class="brand-logo" src="./img/logo.png" alt="微商城"></a>
      <div class="page-title">我的订单</div>
      <div class="mast-actions">
        <a class="btn-ghost" href="/cart.html">我的购物车</a>
        <a class="btn-ghost" href="/search.html">去购物</a>
      </div>
    </div>
  </header>

  <main class="flow-main">
    <div class="wrap">

      <div class="card">
        <div class="card-head">
          <strong>订单列表</strong>
          <span class="hint" v-if="orders.length">共 {{orders.length}} 笔订单</span>
        </div>
        <div class="card-body">

          <div class="order-note">订单号来自本机浏览器的下单记录，状态与金额实时从后端查询。</div>

          <template v-if="orders.length">
            <div class="order-card" :class="{hl: String(o.id) === String(focusId)}" v-for="o in orders" :key="o.id">
              <div class="order-head">
                <span class="no">订单号 <b>{{o.id}}</b> · 下单时间 {{o.data ? util.fmtTime(o.data.createTime) : "—"}}</span>
                <span class="status" :class="statusClass(o)">{{o.error ? "查询失败" : statusText(o.data.status)}}</span>
              </div>
              <div class="order-body">
                <div class="order-info">
                  <div class="kv"><small>订单金额</small><span class="money">￥{{o.data ? util.formatPrice(o.data.totalFee || 0) : "0.00"}}</span></div>
                  <div class="kv"><small>支付方式</small><span>{{payText(o.data.paymentType)}}</span></div>
                  <div class="kv"><small>支付时间</small><span>{{o.data ? util.fmtTime(o.data.payTime) : "—"}}</span></div>
                </div>
                <div class="order-act">
                  <a class="btn btn-primary" v-if="!o.error && o.data.status === 1" :href="'/pay.html?id=' + o.id">去支付</a>
                  <a class="btn btn-plain" v-else href="/search.html">再次购买</a>
                  <a class="link muted" href="javascript:void(0)" @click="remove(o.id)">移除记录</a>
                </div>
              </div>
            </div>
          </template>

          <div class="empty-state" v-else-if="loading">
            <div class="badge">
              <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                <path d="M6 2h9l4 4v16H6z"/><path d="M15 2v5h4"/><path d="M9 12h7M9 16h7"/>
              </svg>
            </div>
            <h3>正在查询订单…</h3>
          </div>
          <div class="empty-state" v-else>
            <div class="badge">
              <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                <path d="M6 2h9l4 4v16H6z"/><path d="M15 2v5h4"/><path d="M9 12h7M9 16h7"/>
              </svg>
            </div>
            <h3>还没有订单记录</h3>
            <p>下单完成后，订单会自动出现在这里</p>
            <a class="btn btn-primary" href="/search.html">去购物</a>
          </div>

        </div>
      </div>

    </div>
  </main>

  <footer>
    <div class="wrap">
      <div class="f-brand">
        <strong>微商城</strong><small>WEI MALL</small><p>好物优选 · 轻松购</p>
      </div>
    </div>
    <div class="f-bottom">© 2026 微商城 WEI MALL · 演示项目</div>
  </footer>
</div>

<script src="./js/vue.js"></script>
<script src="./js/axios.min.js"></script>
<script src="./js/common.js"></script>
<script>
  const STATUS = {1: "未付款", 2: "已付款·待发货", 3: "已发货", 4: "交易成功", 5: "订单已关闭", 6: "交易结束"};
  new Vue({
    el: "#app",
    data: {
      util,
      orders: [],
      loading: true,
      focusId: util.getUrlParam("orderId")
    },
    created() {
      util.store.set("return-url", location.href);
      if (!util.store.get("user-info")) { location.href = "/login.html"; return; }
      if (this.focusId) util.rememberOrder(this.focusId);
      let ids = util.myOrders();
      if (this.focusId && !ids.some(x => String(x) === String(this.focusId))) {
        ids = [String(this.focusId)].concat(ids);
      }
      if (!ids.length) { this.loading = false; return; }
      Promise.all(ids.map(id => axios.get("/orders/" + id)
        .then(data => ({id: id, data: data, error: false}))
        .catch(() => ({id: id, data: {}, error: true}))))
        .then(list => { this.orders = list; this.loading = false; });
    },
    methods: {
      statusText(s) { return STATUS[s] || "处理中"; },
      statusClass(o) {
        if (o.error || o.data.status === 5) return "off";
        if (o.data.status === 1) return "wait";
        return "done";
      },
      payText(t) { return ["支付宝支付", "微信支付", "扣减余额"][t - 1] || "—"; },
      remove(id) {
        localStorage.setItem("wm-orders", JSON.stringify(util.myOrders().filter(x => String(x) !== String(id))));
        this.orders = this.orders.filter(o => String(o.id) !== String(id));
      }
    }
  });
</script>
<script src="./js/auth.js"></script>
</body>
</html>
